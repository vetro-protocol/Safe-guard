# Dependabot security updates are enabled for this repository. Nothing in this file may touch the
# Solidity dependency of the deployed contracts: a bump of @openzeppelin/contracts recompiles
# CuratorGuard and CuratorGuardTimelock to other bytecode than the reviewed build (review G12a-1;
# test/guards/G12a_BuildPin.t.sol pins it). Bump it by hand, with a review of the diff and a re-pin.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@openzeppelin/contracts"
      # The tooling is written for hardhat 2 / hardhat-deploy 1 (the hardhat 3 bump of 2026-10-08 breaks
      # every task and the deploy script: tsc fails on main).
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hardhat-deploy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-toolbox"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-network-helpers"
        update-types: ["version-update:semver-major"]
